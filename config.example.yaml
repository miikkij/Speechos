#   model: vibevoice/VibeVoice-1.5B
#   device: cuda

# emotion:
#   engine: emotion2vec         # emotion2vec | wav2vec2-ser | hubert-ser | wavlm-ser | wav2small
#   model: iic/emotion2vec_plus_large   # iic/emotion2vec_base_finetuned | iic/emotion2vec_plus_large
#   device: cuda

# diarization:
#   engine: pyannote            # pyannote | sortformer | speechbrain | resemblyzer
#   model: pyannote/speaker-diarization-community-1   # 4.0, free (supersedes 3.1)
#   device: cpu

# vad:
#   engine: silero
