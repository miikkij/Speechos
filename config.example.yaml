# Speechos Configuration
# =====================
# Override auto-detection with explicit settings.
# All fields are optional — omit to use auto-detected defaults.

# ── Compute Mode ──────────────────────────────────────────
# Options: auto | cpu | gpu | hybrid
# "auto" detects GPU and picks hybrid if both available
compute_mode: auto

# ── Hardware Tier ─────────────────────────────────────────
# Options: auto | cpu-2gb | cpu-4gb | cpu-8gb | cpu-16gb | cpu-32gb
#          gpu-4gb | gpu-8gb | gpu-12gb | gpu-24gb | gpu-32gb
#          hybrid-4gb-gpu | hybrid-8gb-gpu | hybrid-12gb-gpu
#          hybrid-24gb-gpu | hybrid-32gb-gpu
# "auto" detects RAM/VRAM and picks the right tier
tier: auto

# ── Model Overrides ───────────────────────────────────────
# Uncomment to override individual model selections.
# These take precedence over tier defaults.

# stt:
#   engine: faster-whisper      # faster-whisper | vosk | whisperx | moonshine | nemo | wav2vec2-stt | granite-speech
#   model: large-v3             # tiny | base | small | medium | large-v3 | turbo
#                               # nemo: nvidia/parakeet-tdt-0.6b-v3 | nvidia/canary-qwen-2.5b | nvidia/canary-1b-v2
#                               # granite-speech: ibm-granite/granite-speech-4.1-2b
#   device: cuda                # cuda | cpu
#   compute_type: float16       # float16 | int8_float16 | int8

# tts:
#   # Native (in-process): piper | kokoro | kitten | chatterbox | bark | espeak
#   # Docker (WSL2 GPU):   vibevoice | qwen3-tts | xtts | chattts | melotts | orpheus | fish-speech | cosyvoice | parler
#   engine: kokoro
#   model: default
#   device: cuda

# tts_expressive:
#   engine: orpheus
#   model: orpheus-3b
#   device: cuda
#   compute_type: float16

# tts_fast:
#   engine: piper
#   model: en_US-lessac-medium
#   device: cpu

# Long-form / multi-speaker (podcast) synthesis — VibeVoice (Docker, GPU-only):
# tts_clone:
