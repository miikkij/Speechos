# Speechos Configuration
# =====================
# Override auto-detection with explicit settings.
# All fields are optional — omit to use auto-detected defaults.

# ── Compute Mode ──────────────────────────────────────────
# Options: auto | cpu | gpu | hybrid
# "auto" detects GPU and picks hybrid if both available
compute_mode: auto

# ── Hardware Tier ─────────────────────────────────────────
# Options: auto | cpu-2gb | cpu-4gb | cpu-8gb | cpu-16gb | cpu-32gb
#          gpu-4gb | gpu-8gb | gpu-12gb | gpu-24gb | gpu-32gb
#          hybrid-4gb-gpu | hybrid-8gb-gpu | hybrid-12gb-gpu
#          hybrid-24gb-gpu | hybrid-32gb-gpu
# "auto" detects RAM/VRAM and picks the right tier
tier: auto

# ── Model Overrides ───────────────────────────────────────
# Uncomment to override individual model selections.
# These take precedence over tier defaults.

# stt:
#   engine: faster-whisper      # faster-whisper | vosk | whisperx | moonshine | nemo | wav2vec2-stt | granite-speech
#   model: large-v3             # tiny | base | small | medium | large-v3 | turbo
#                               # nemo: nvidia/parakeet-tdt-0.6b-v3 | nvidia/canary-qwen-2.5b | nvidia/canary-1b-v2
#                               # granite-speech: ibm-granite/granite-speech-4.1-2b
#   device: cuda                # cuda | cpu
#   compute_type: float16       # float16 | int8_float16 | int8

# tts:
#   # Native (in-process): piper | kokoro | kitten | chatterbox | bark | espeak
#   # Docker (WSL2 GPU):   vibevoice | qwen3-tts | xtts | chattts | melotts | orpheus | fish-speech | cosyvoice | parler
#   # Default on every tier: Piper Finnish. Requests with language=en switch to
#   # en_US-lessac-medium automatically. Kokoro has no Finnish (returns 400 for fi).
#   engine: piper
#   model: fi_FI-harri-medium
#   device: cpu

# tts_expressive:
#   engine: orpheus
#   model: orpheus-3b
#   device: cuda
#   compute_type: float16

# Optional slots, used via POST /api/synthesize {"slot": "fast" | "expressive" | "clone"}
# tts_fast:
#   engine: piper
#   model: fi_FI-harri-low
#   device: cpu

# Long-form / multi-speaker (podcast) synthesis — VibeVoice (Docker, GPU-only):
# tts_clone:
#   engine: vibevoice           # community fork via OpenAI-compatible server
#   model: vibevoice/VibeVoice-1.5B
#   device: cuda

# emotion:
#   engine: emotion2vec         # emotion2vec | wav2vec2-ser | hubert-ser | wavlm-ser | wav2small
#   model: iic/emotion2vec_plus_large   # iic/emotion2vec_base_finetuned | iic/emotion2vec_plus_large
#   device: cuda

# diarization:
#   engine: pyannote            # pyannote | sortformer | speechbrain | resemblyzer
#   model: pyannote/speaker-diarization-community-1   # 4.0, gated: needs HF_TOKEN
#   device: cuda
#   # Default on GPU >= 12 GB tiers when HF_TOKEN is set and pyannote.audio is
#   # installed (uv sync --extra gpu); Resemblyzer otherwise.

# vad:
#   engine: silero
#   device: cpu

# ── Server ────────────────────────────────────────────────
server:
  host: 0.0.0.0
  port: 36300
  workers: 1            # Keep at 1 for GPU (shared VRAM)
  cors_origins:          # also SPEECHOS_CORS_ORIGINS (comma-separated)
    - "http://localhost:36301"
    - "http://localhost:80"
    - "http://localhost"

# ── Storage ───────────────────────────────────────────────
storage:
  model_dir: ./models         # Where to download/cache models
  recordings_dir: ./recordings
  samples_dir: ./samples
  max_upload_mb: 100

# ── Model Loading Strategy ────────────────────────────────
# "eager": Preload STT, TTS and VAD in the background at startup (faster first request)
# "lazy":  Load on first request (slower first request, lower memory baseline)
model_loading: lazy

# VRAM budgets / LRU eviction are not implemented yet (see ARCHITECTURE.md → Roadmap).
# Models stay loaded until switched (POST /api/system/switch-model) or unloaded
# (POST /api/models/unload/{key}).
