[project]
name = "speechos-api"
version = "0.1.0"
description = "Speechos — local speech analysis & synthesis API"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0",
    "psutil>=6.0",
    "aiofiles>=24.1.0",
    "websockets>=13.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "faster-whisper>=1.1.0",
    "vosk>=0.3.45",
    "piper-tts>=1.2.0",
    "silero-vad>=5.1",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "resemblyzer>=0.1.4",
    "setuptools<75",
    "pandas>=3.0.1",
    "funasr>=1.3.1",
    "kokoro>=0.3.0",
    "transformers>=4.40.0,<5.0.0",
    "opensmile>=2.6.0",
    "httpx>=0.27.0",
    # Finnish text normalization for TTS input (src/engines_fi/text_norm_fi.py)
    "num2words>=0.5.13",
]

[project.optional-dependencies]
gpu = [
    "funasr>=1.1.0",
    "modelscope>=1.17.0",
    "pyannote.audio>=4.0",  # speaker-diarization-community-1 needs 4.x
]
speechbrain = [
    "speechbrain>=1.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "httpx2>=2.13",  # Starlette 1.x TestClient prefers it over httpx
    "ruff>=0.8.0",
]
bench = [
    "jiwer>=3.0.0",
    "datasets>=3.0.0",
    "torchcodec>=0.11,<0.12",  # datasets>=4 decodes Audio via torchcodec; CPU build, see [tool.uv.sources]
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
]

# Qwen3-ASR (transformers backend). qwen-asr pins transformers==4.57.6 (= core lock) and pulls
# gradio, which lifts starlette to 1.x inside this extra only.
bench-qwen = [
    "qwen-asr>=0.0.6",
]

# Finnish TTS bench: edge-tts (cloud reference voices) + UTMOSv2 naturalness predictor (git, pinned).
bench-tts = [
    "edge-tts>=7.2.0",
    "utmosv2",  # git source pinned in [tool.uv.sources] (not on PyPI)
]
# Runtime deps of the Chatterbox code bundled in Finnish-NLP/Chatterbox-Finnish (src/engines_fi).
# The PyPI chatterbox-tts package pins torch==2.6 / transformers==5.2 and cannot share this lock.
# diffusers<0.31: the bundled S3Gen decoder imports diffusers.models.lora.LoRACompatibleLinear.
tts-fi = [
    "resemble-perth>=1.0.1",
    "s3tokenizer>=0.3.0",
    "conformer==0.3.2",
    "diffusers>=0.29.0,<0.31",
    "omegaconf>=2.3",
    "einops>=0.6",
    "safetensors>=0.4",
    "num2words>=0.5.13",  # src/engines_fi/text_norm_fi.py
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
# torchcodec only decodes dataset audio for the bench; the CPU build avoids the
# CUDA-13 / NPP runtime deps the default PyPI wheel pulls against a cu128 torch.
torchcodec = { index = "pytorch-cpu" }
# bench-tts only: UTMOSv2 is not on PyPI.
utmosv2 = { git = "https://github.com/sarulab-speech/UTMOSv2", rev = "cc2700db57bb83ee13dc31ebe1b868c254e15d09" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Tests that load real models are opt-in: uv run pytest -m models
addopts = "-m 'not models'"
filterwarnings = [
    # third-party: perth (Chatterbox watermarking) still imports pkg_resources
    "ignore:pkg_resources is deprecated:DeprecationWarning",
]
markers = [
    "models: needs real model weights (downloads on first run); skipped by default",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["."]
extend-exclude = ["bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",   # FastAPI File()/Form() defaults
    "B904",   # raise-from inside except — not enforced on legacy loaders
    "UP017",  # datetime.UTC alias
    "B905",   # zip(strict=) — Python 3.10+ only nicety
]

[tool.ruff.lint.per-file-ignores]
"src/routers/system.py" = ["E501"]  # model option table
