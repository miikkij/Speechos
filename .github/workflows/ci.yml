name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: api/requirements-ci.txt

      # The full dependency set pins CUDA torch (cu128) and several model
      # runtimes. Unit tests mock all models, so CI installs only what they
      # import — no torch, no GPU, no model downloads.
      - name: Install test dependencies
        run: |
          uv venv --python 3.12
          uv pip install -r requirements-ci.txt

      - name: Ruff
        run: uv run --no-sync ruff check src tests

      - name: Pytest
        run: uv run --no-sync pytest -q

  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from web/package.json "packageManager"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
