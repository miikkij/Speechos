# ============================================================
# Speechos — Docker TTS Engines (GPU)
# ============================================================
# These run via WSL2 Docker, one at a time to share GPU.
# Usage from PowerShell:
#   bash -c "docker compose -f /mnt/e/dev/GitHub/Speechos/docker/tts-engines.yml up -d xtts"
#   bash -c "docker compose -f /mnt/e/dev/GitHub/Speechos/docker/tts-engines.yml stop xtts"
#
# Or from the API: POST /system/switch-model auto-manages containers.
# ============================================================

services:
  # ── XTTS-v2 / Coqui TTS (official image) ─────────────
  # 17 languages, voice cloning, 1.8GB model
  # API: GET /api/tts?text=...&language_id=en
  xtts:
    image: ghcr.io/coqui-ai/tts
    container_name: speechos-tts-xtts
    ports:
      - "36310:5002"
    volumes:
      - tts-xtts-models:/root/.local/share/tts
      - ../samples:/voice_samples:ro
    command: >
      --model_name tts_models/multilingual/multi-dataset/xtts_v2
      --server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"

  # ── ChatTTS (dialog-optimized TTS) ────────────────────
  # Natural dialog speech with prosody control
  # API: POST http://localhost:36311/generate (JSON)
  chattts:
    image: yikchunnnn/chattts-dockerized:latest
    container_name: speechos-tts-chattts
    ports:
      - "36311:9000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"

  # ── MeloTTS (multilingual, fast) ──────────────────────
  # 6 languages, Gradio UI + REST API
  # API: POST /tts/convert/tts {"text":"...","language":"EN","speaker_id":"EN-US"}
  melotts:
    image: sensejworld/melotts:v0.0.4
    container_name: speechos-tts-melotts
    ports:
      - "36312:8888"
    environment:
      - TTS_LANGUAGES=EN
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"

  # ── Orpheus TTS (emotional speech, 3B) ────────────────
  # Expressive with emotion tags, Gradio UI + REST API
  # API: POST /api/synthesize {"text":"..."}
  orpheus:
    image: neosun/orpheus-tts:v1.5.0-allinone
    container_name: speechos-tts-orpheus
    ports:
      - "36313:8080"
    volumes:
      - tts-orpheus-cache:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"

  # ── Fish Speech 1.5 (official image) ──────────────────
  # Voice cloning, real-time streaming, high quality
  # API: WebUI on port 7860, API server  
  fish-speech:
    image: fishaudio/fish-speech:latest-webui-cuda
    container_name: speechos-tts-fish
    ports:
      - "36314:7860"
    volumes:
      - tts-fish-checkpoints:/app/checkpoints
      - ../samples:/app/references:ro
    environment:
      - COMPILE=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"

  # ── CosyVoice 2 (multilingual, voice cloning) ────────
  # Zero-shot voice cloning, streaming synthesis
  # API: HTTP on port 8080
  cosyvoice:
    image: catcto/cosyvoice:latest
    container_name: speechos-tts-cosyvoice
    ports:
      - "36315:8080"
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"

  # ── Qwen3-TTS (SOTA quality, 0.6B/1.7B) ─────────────
  # Voice cloning, emotion control, 10 languages
  # Build from GitHub: ValyrianTech/Qwen3-TTS_server
  # API: GET /base_tts/?text=... or GET /synthesize_speech/?text=...&voice=...
  qwen3-tts:
    build:
      context: ./qwen3-tts-server
      dockerfile: Dockerfile
    image: speechos-qwen3-tts
    container_name: speechos-tts-qwen3
    ports:
      - "36316:7860"
    volumes:
      - tts-qwen3-models:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"

  # ── Parler-TTS (description-driven voice) ─────────────
  # OpenAI-compatible API, natural voice descriptions
  # API: POST /v1/audio/speech {"input":"...","voice":"description"}
  parler:
    image: fedirz/parler-tts-server:latest
    container_name: speechos-tts-parler
    ports:
      - "36317:8000"
    volumes:
      - tts-parler-models:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"

  # ── VibeVoice (long-form, multi-speaker podcast TTS) ──
  # Community fork (vibevoice-community/VibeVoice) served by the OpenAI-compatible
  # vibevoice-api server. 1.5B model (~7-8GB VRAM); use "Speaker 0:" prefixes for
  # multi-speaker scripts. GPU-only, 24kHz output.
  # API: POST /v1/audio/speech {"model":"...","input":"...","voice":"Frank","response_format":"wav"}
  vibevoice:
    build:
      context: ./vibevoice-server
      dockerfile: Dockerfile
    image: speechos-vibevoice
    container_name: speechos-tts-vibevoice
    ports:
      - "36318:8000"
    environment:
      - VIBEVOICE_MODEL=vibevoice/VibeVoice-1.5B
    volumes:
      - tts-vibevoice-models:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"

volumes:
  tts-xtts-models:
  tts-orpheus-cache:
  tts-fish-checkpoints:
  tts-qwen3-models:
  tts-parler-models:
  tts-vibevoice-models:
